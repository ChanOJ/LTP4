<html>
<head>
<title>Lucky &amp; Tigrou party session 4 - August 2000</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<script>window.RufflePlayer = window.RufflePlayer || {}; window.RufflePlayer.config = {"publicPath": "ruffle/", "polyfills": false, "preferredRenderer": "canvas", "autoplay": "on", "unmuteOverlay": "hidden", "splashScreen": false, "contextMenu": "off"};</script>
<script src="ruffle/ruffle.js"></script>
</head>

<body bgcolor="#000000" text="#996600" link="#996600" vlink="#996600" alink="#996600">
<div align="center">
  <div id="ltpintro" style="width:740px;height:260px"></div>
<script>window.addEventListener("load", function () {
  var player = window.RufflePlayer.newest().createPlayer();
  player.style.width = "740px"; player.style.height = "260px";
  document.getElementById("ltpintro").appendChild(player);
  player.ruffle().load({url: "img/ltpintro.swf", quality: "high", preferredRenderer: "canvas", backgroundColor: "#000000"});
});</script> </div>
<div align="center"> 
  <p><br>
    <b><font color="#FFFFFF" face="Verdana, Arial, Helvetica, sans-serif" size="3"><a href="news.html">Enter 
    </a></font></b><br>
    This website support <a href="ftp://ftp.vtm.gervis.net/download/npmod.zip">Modplug</a> 
    sound and Flash. Please download those small plugins.<br>
    <a href="music/dis2them.mod" id="tune">Tune : Dis2them by Pink / Absys</a><br><font size="1" id="tunehint">[click the page or press a key to hear the tune]</font>
    </p>
</div>
<script type="module">
import { ChiptuneJsPlayer } from "./chiptune/chiptune3.js";
const tune = document.getElementById("tune"), hint = document.getElementById("tunehint");
let player = null, paused = false, skipClick = false;
function say(m) { hint.textContent = "[" + m + "]"; }
function start(e) {
  if (player) return;
  if (e && e.target.closest && e.target.closest("#tune")) skipClick = true;  // this gesture only starts it
  say("loading the tune...");
  player = new ChiptuneJsPlayer({ repeatCount: -1 });
  player.onInitialized(() => { player.context.resume(); player.load("music/dis2them.mod"); say("playing: click the tune to pause"); });
  player.onError(() => say("the tune cannot be played in this browser"));
}
addEventListener("pointerdown", start, { once: true });
addEventListener("keydown", start, { once: true });
tune.addEventListener("click", (e) => {
  e.preventDefault();
  if (skipClick) { skipClick = false; return; }
  if (!player) return start();
  paused = !paused; player.togglePause();
  say(paused ? "paused: click the tune to resume" : "playing: click the tune to pause");
});
</script>
</body>
</html>
